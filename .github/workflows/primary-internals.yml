name: VoltZilla primary contract internals (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  push:
    paths:
      - scripts/audit_primary_internals.py
      - tests/test_primary_internals.py
      - .github/workflows/primary-internals.yml
permissions:
  contents: read
jobs:
  internals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify binary Token-2022 parser and supply reconciliation offline
        run: python3 -m unittest discover -s tests -p "test_primary_internals.py" -v
      - name: Inspect GDY mint authorities, extensions and top token accounts from Solana mainnet
        run: python3 scripts/audit_primary_internals.py --check > primary-internals.json
      - name: Print nonsecret on-chain internals evidence summary
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open("primary-internals.json", encoding="utf-8"))
          print("network", data["network"])
          print("program", data["program"])
          print("mint", data["mint"])
          print("RPC", data["rpc_endpoint"])
          print("supply", data["mint_state"]["supply_ui"])
          print("mint_authority", data["mint_state"]["mint_authority"])
          print("freeze_authority", data["mint_state"]["freeze_authority"])
          print("extensions", [(x["name"], x["byte_length"]) for x in data["extensions"]])
          print("embedded_metadata", data["embedded_token_metadata"])
          print("holder_coverage", data["holder_discovery"]["coverage"])
          print("curve_percent", data["holders"]["pool_share_percent"])
          print("creator_percent", data["holders"]["creator_share_percent"])
          print("unaccounted_tokens", data["holders"]["unaccounted_ui"])
          print("review_flags", data["review_flags"])
          PY
      - name: Preserve timestamped on-chain evidence JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voltzilla-primary-token-internals
          path: primary-internals.json
          if-no-files-found: warn
          retention-days: 30
