name: VoltZilla source claim verification
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - website/index.html
      - README.md
      - STATUS.md
      - docs/**
      - assets/metadata.json
      - tests/**
      - scripts/release_preflight.py
      - project-manifest.json
      - docs/SECURITY_RECOVERY.md
      - .github/workflows/verify-claims.yml
jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify release status manifest without publishing
        run: |
          python3 scripts/release_preflight.py --check
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(["python3", "scripts/release_preflight.py", "--release"], capture_output=True, text=True)
          print(result.stdout)
          assert result.returncode == 2, "Launch must stay blocked until independently verified"
          PY
      - name: Verify unsupported claims do not return
        run: |
          python3 tests/check_claims.py
          python3 -m unittest discover -s tests -p "test_*.py" -v
