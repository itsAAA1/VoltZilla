name: VoltZilla source claim verification
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - website/index.html
      - README.md
      - STATUS.md
      - docs/**
      - assets/metadata.json
      - tests/**
      - .github/workflows/verify-claims.yml
jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify unsupported claims do not return
        run: |
          python3 tests/check_claims.py
          python3 -m unittest discover -s tests -p "test_*.py" -v
